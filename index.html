<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapdish | Order Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <h1>Tapdish</h1>
        <button id="cart-button">Cart (0)</button>
    </header>

    <section class="banner">
        <h2>Tap what you crave.</h2>
        <p>Browse the menu, customize your order, pick it up fresh</p>
    </section>

    <main>
        <section id="menu">
            <!-- menu cards get added here by script.js -->
        </section>
    </main>

    <div id="overlay" class="overlay"></div>

    <aside id="cart-panel" class="cart-panel">
        <div class="cart-head">
            <h2>Your order</h2>
            <button id="close-cart">Close</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-foot">
            <p>Total: <strong id="cart-total">$0.00</strong></p>
            <button id="checkout-button">Checkout</button>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
