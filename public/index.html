<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapdish | Order Online</title>
<meta name="description" content="Tap what you crave. Browse the menu, customize your order, get it delivered hot.">
<meta name="theme-color" content="#C93A1F">
<link rel="canonical" href="https://tapdish.senvor.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tapdish">
<meta property="og:url" content="https://tapdish.senvor.dev/">
<meta property="og:title" content="Tapdish | Tap what you crave">
<meta property="og:description" content="Browse the menu, customize your order, get it delivered hot.">
<meta property="og:image" content="https://tapdish.senvor.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tapdish: Tap what you crave, with a plate of food and an Order now button">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tapdish | Tap what you crave">
<meta name="twitter:description" content="Browse the menu, customize your order, get it delivered hot.">
<meta name="twitter:image" content="https://tapdish.senvor.dev/og.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script>
        // black is the default; remember the choice
        document.documentElement.dataset.theme = localStorage.getItem('tapdish-theme') === 'light' ? 'light' : 'dark';
    </script>
</head>
<body>

    <header class="top-bar">
        <h1>Tapdish</h1>
        <div class="top-actions">
            <button id="theme-toggle" aria-label="Switch theme" title="Switch theme">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <mask id="moon-mask">
                        <rect x="0" y="0" width="24" height="24" fill="white"/>
                        <circle class="bite" cx="17" cy="7" r="7" fill="black"/>
                    </mask>
                    <circle class="core" cx="12" cy="12" r="9" fill="currentColor" mask="url(#moon-mask)"/>
                    <g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/>
                        <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>
                    </g>
                </svg>
            </button>
            <button id="orders-button">Orders</button>
            <button id="cart-button">Cart (0)</button>
        </div>
        <nav id="category-nav" class="category-nav"></nav>
    </header>

    <section class="banner">
        <h2>Tap what you crave.</h2>
        <p>Browse the menu, customize your order, get it delivered hot.</p>
    </section>

    <main>
        <section id="menu">
            <!-- menu cards get added here by script.js -->
        </section>
    </main>

    <div id="overlay" class="overlay"></div>

    <aside id="cart-panel" class="cart-panel">
        <div class="cart-head">
            <h2>Your order</h2>
            <button id="close-cart">Close</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-foot">
            <p>Total: <strong id="cart-total">$0.00</strong></p>
            <button id="checkout-button">Checkout</button>
        </div>
    </aside>

    <div id="checkout" class="checkout">
        <form id="checkout-form" class="checkout-box">
            <h2>Checkout</h2>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <p>Total: <strong id="checkout-total"></strong></p>

            <div class="checkout-buttons">
                <button type="button" id="cancel-checkout">Back</button>
                <button type="submit">Place order</button>
            </div>
        </form>

        <div class="checkout-box confirmation">
            <h2>Order placed</h2>
            <p>Thanks, <strong id="confirm-name"></strong>.</p>
            <p>Your order number is <strong id="confirm-number"></strong>.</p>
            <button type="button" id="close-confirmation">Done</button>
        </div>
    </div>

    <div id="orders-view" class="checkout">
        <div class="checkout-box orders-box">
            <h2>All orders</h2>

            <form id="orders-key-form">
                <label for="admin-key">Admin key</label>
                <input type="password" id="admin-key" required>
                <button type="submit">View orders</button>
            </form>

            <div id="orders-list"></div>

            <button type="button" id="close-orders">Close</button>
        </div>
    </div>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('tapdish-theme', next);
        });
    </script>
    <script src="menu.js"></script>
    <script src="script.js"></script>
</body>
</html>
