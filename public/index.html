<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapdish | Order Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <h1>Tapdish</h1>
        <div class="top-actions">
            <button id="orders-button">Orders</button>
            <button id="cart-button">Cart (0)</button>
        </div>
        <nav id="category-nav" class="category-nav"></nav>
    </header>

    <section class="banner">
        <h2>Tap what you crave.</h2>
        <p>Browse the menu, customize your order, pick it up fresh</p>
    </section>

    <main>
        <section id="menu">
            <!-- menu cards get added here by script.js -->
        </section>
    </main>

    <div id="overlay" class="overlay"></div>

    <aside id="cart-panel" class="cart-panel">
        <div class="cart-head">
            <h2>Your order</h2>
            <button id="close-cart">Close</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-foot">
            <p>Total: <strong id="cart-total">$0.00</strong></p>
            <button id="checkout-button">Checkout</button>
        </div>
    </aside>

    <div id="checkout" class="checkout">
        <form id="checkout-form" class="checkout-box">
            <h2>Checkout</h2>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <p>Total: <strong id="checkout-total"></strong></p>

            <div class="checkout-buttons">
                <button type="button" id="cancel-checkout">Back</button>
                <button type="submit">Place order</button>
            </div>
        </form>

        <div class="checkout-box confirmation">
            <h2>Order placed</h2>
            <p>Thanks, <strong id="confirm-name"></strong>.</p>
            <p>Your order number is <strong id="confirm-number"></strong>.</p>
            <button type="button" id="close-confirmation">Done</button>
        </div>
    </div>

    <div id="orders-view" class="checkout">
        <div class="checkout-box orders-box">
            <h2>All orders</h2>

            <form id="orders-key-form">
                <label for="admin-key">Admin key</label>
                <input type="password" id="admin-key" required>
                <button type="submit">View orders</button>
            </form>

            <div id="orders-list"></div>

            <button type="button" id="close-orders">Close</button>
        </div>
    </div>

    <script src="menu.js"></script>
    <script src="script.js"></script>
</body>
</html>
